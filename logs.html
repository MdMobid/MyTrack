<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MyTrack — Logs</title>
  <link rel="stylesheet" href="css/shared.css">
  <link rel="stylesheet" href="css/logs.css">
  <link rel="icon" type="image/png" href="assets/icon-192.png">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0f172a">
  <link rel="apple-touch-icon" href="assets/icon-192.png">
</head>

<body>
  <div id="app" class="app">

    <!-- TOP NAVIGATION -->
    <nav class="topnav">
      <a href="index.html" class="topnav__brand">
        <div class="topnav__logo" aria-label="MyTrack Logo">
          <img src="assets/icon-192.png" alt="MyTrack" class="topnav__logo-img">
        </div>
        <div>
          <div class="topnav__name">MyTrack</div>
          <div class="topnav__tagline">Personal Dashboard</div>
        </div>
      </a>
      <div class="topnav__links">
        <a href="index.html" class="topnav__link"><span class="topnav__link-icon">📅</span><span>Today</span></a>
        <a href="habits.html" class="topnav__link"><span class="topnav__link-icon">🎯</span><span>Habits</span></a>
        <a href="todos.html" class="topnav__link"><span class="topnav__link-icon">✅</span><span>Todos</span></a>
        <a href="expenses.html" class="topnav__link"><span class="topnav__link-icon">💰</span><span>Expenses</span></a>
        <a href="logs.html" class="topnav__link active"><span class="topnav__link-icon">📝</span><span>Logs</span></a>
      </div>
      <button class="btn-primary" id="btnAddLog" style="background:var(--grad-primary);box-shadow:0 4px 18px var(--cyan-dim);">
        <span style="font-size:1.1rem;font-weight:300">＋</span><span class="btn-text"> New Log</span>
      </button>
    </nav>

    <!-- TOOLBAR / SEARCH & DATE FILTER -->
    <div class="logs-toolbar">
      <div class="logs-search">
        <span class="logs-search__icon">🔍</span>
        <input type="text" id="logSearchInput" class="logs-search__input" placeholder="Search logs...">
        <button id="logSearchClear" class="logs-search__clear" title="Clear search" style="display:none;">✕</button>
      </div>
      <button class="logs-filter-btn" id="btnFilterLogs" title="Filter by date">
        <span class="logs-filter-btn__icon">📅</span>
        <span class="logs-filter-btn__text">Filter</span>
        <span class="logs-filter-btn__badge" id="logFilterBadge" style="display:none;"></span>
      </button>
    </div>

    <!-- ACTIVE FILTER BANNER -->
    <div class="logs-active-filter-bar" id="logsActiveFilterBar" style="display:none;">
      <div class="logs-active-filter-bar__content">
        <span class="logs-active-filter-bar__icon">📅</span>
        <span id="logsActiveFilterText">Filtered by date</span>
      </div>
      <button id="btnClearActiveFilter" class="logs-active-filter-bar__clear" title="Clear date filter">✕ Clear</button>
    </div>

    <!-- LOG FEED -->
    <main id="logsFeed" class="logs-feed" aria-label="Logs Feed">
      <!-- Day groups & log items rendered dynamically here -->
    </main>

  </div>

  <!-- TOAST CONTAINER -->
  <div class="toast-container" id="toastContainer"></div>

  <!-- DATE FILTER MODAL -->
  <div class="modal-overlay" id="filterModal">
    <div class="modal" style="max-width: 440px;">
      <button class="modal__close" id="filterModalClose">✕</button>
      <h2 class="modal__title">Filter Logs</h2>

      <div class="modal__field" style="margin-top: 14px;">
        <label class="modal__label">Quick Presets</label>
        <div class="filter-preset-chips" id="filterPresetChips">
          <button type="button" class="filter-preset-chip" data-preset="today">Today</button>
          <button type="button" class="filter-preset-chip" data-preset="yesterday">Yesterday</button>
          <button type="button" class="filter-preset-chip" data-preset="week">This Week</button>
          <button type="button" class="filter-preset-chip active" data-preset="all">All</button>
        </div>
      </div>

      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 14px;">
        <div class="modal__field">
          <label class="modal__label">From Date</label>
          <input class="modal__input" type="date" id="filterFromDate">
        </div>
        <div class="modal__field">
          <label class="modal__label">To Date</label>
          <input class="modal__input" type="date" id="filterToDate">
        </div>
      </div>
      <p style="font-size: 0.74rem; color: var(--t3); margin-top: 8px;">
        * If only "From Date" is selected, logs for that day only will be shown.
      </p>

      <div class="modal__actions" style="margin-top: 20px;">
        <button type="button" class="modal__btn modal__btn--cancel" id="btnResetFilter">Reset</button>
        <button type="button" class="modal__btn modal__btn--primary" id="btnApplyFilter" style="background:var(--grad-primary);">Apply Filter</button>
      </div>
    </div>
  </div>

  <!-- ADD / EDIT LOG MODAL -->
  <div class="modal-overlay" id="logModal">
    <div class="modal" style="max-width: 520px;">
      <button class="modal__close" id="logModalClose">✕</button>
      <h2 class="modal__title" id="logModalTitle">New Log</h2>
      <div class="modal__field" style="margin-top: 14px;">
        <label class="modal__label">Date</label>
        <input class="modal__input" type="date" id="modalLogDate">
      </div>
      <div class="modal__field" style="margin-top: 14px;">
        <label class="modal__label">What's on your mind?</label>
        <textarea class="modal__input" id="modalLogText" rows="4"
          placeholder="Write a log, reflection, or note..."
          style="resize: vertical; min-height: 100px; font-size: 0.95rem; line-height: 1.5;"></textarea>
      </div>
      <div class="modal__actions" style="margin-top: 20px;">
        <button class="modal__btn modal__btn--cancel" id="btnCancelLog">Cancel</button>
        <button class="modal__btn modal__btn--primary" id="btnSaveLog" style="background:var(--grad-primary);">Save Log</button>
      </div>
    </div>
  </div>

  <!-- SCRIPTS -->
  <script src="js/db.js"></script>
  <script src="js/logs.js"></script>
</body>

</html>
